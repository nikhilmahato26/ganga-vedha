name: Deploy Backend

# API Worker "ganga-vedha-api" + D1 migrations. Runs only when the API or the frontend files it
# imports change, so a frontend-only change never redeploys the API (ARCHITECTURE.md §06).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      # The API imports these shared files from the frontend (schemas, formatting, closure rules, types).
      - "frontend/src/lib/schemas/**"
      - "frontend/src/lib/format.ts"
      - "frontend/src/lib/closure.ts"
      - "frontend/src/lib/hero-rooms.ts"
      - "frontend/src/lib/why-us-icon-keys.ts"
      - "frontend/src/lib/enquiry-schema.ts"
      - "frontend/src/lib/content-types.ts"
      - "frontend/src/lib/action-types.ts"
      - "frontend/src/lib/media-types.ts"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# Never run two deploys (and two migration runs) at once.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      # The API imports frontend/src/lib files that need the frontend's zod.
      - run: pnpm --dir ../frontend install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Schema first, code second: new Worker code must never query a column that doesn't exist yet.
      - run: pnpm exec wrangler d1 migrations apply ganga-vedha-db --remote
      - run: pnpm exec wrangler deploy
